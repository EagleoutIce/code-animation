name: Compile the showcases
'on':
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v4
    - name: Fetch sopra-listings
      run: git clone --depth 1 https://github.com/EagleoutIce/sopra-collection.git "$RUNNER_TEMP/sopra"
    - name: Compile the Documents
      run: |
        docker run --rm -v "$PWD:/work" -v "$RUNNER_TEMP/sopra:/sopra:ro" -w /work \
          -e TEXINPUTS=.:/sopra//: texlive/texlive:latest \
          latexmk -pdf -interaction=nonstopmode test.tex test-xlistings.tex
    - name: 🖼️ Generate preview
      run: |
        sudo apt-get install -y poppler-utils
        pdftoppm -png -r 300 -f 35 -l 37 ./test.pdf preview
    - name: Commit
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -f test.pdf test-xlistings.pdf preview-*.png
        git commit -m "Newly compiled data"
    - name: Push changes
      run: git push -f origin HEAD:gh-pages
